name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the lowest version the package claims to support: the analyser
        # compiles patterns with the regular-expression `v` flag, which lands there.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Plain audit, not --audit-level=high: the README states the audit is clean, and
      # that claim should fail here the moment it stops being true at any severity.
      - name: Audit dependencies
        run: npm audit

      # The pinned engine version must match the catalogue snapshot captured as its
      # evidence, so a dependency bump cannot silently outrun the write-up.
      - name: Verify snapshot versions
        run: npm run verify:snapshots

      # The generated instrument record must match the installed tree.
      - name: Verify the instrument record is current
        run: |
          npm run instrument
          git diff --exit-code src/instrument.generated.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verify catalogue snapshot integrity
        working-directory: docs/catalogue-snapshots
        run: shasum -a 256 -c SHA256SUMS

  delegated:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Node 22, not 20: jsdom's bundled undici calls webidl.util.markAsUncloneable,
      # which Node 20 does not provide. This constrains the test harness only - the
      # published analyser still runs on Node 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Delegated accessibility suite
        run: npm run test:delegated

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Installs the packed tarball into a clean project. The test suite resolves from
      # this repository's node_modules and so cannot see a runtime import of a package
      # that was only ever a development dependency; this can.
      - name: Verify the published package from a consumer's position
        run: npm run verify:package

  evaluation-harness:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the harness
        uses: actions/checkout@v4

      # The instrument is a SEPARATE checkout at the frozen tag. Testing the harness
      # against this branch would validate it against an analyser the protocol does not
      # name: main's sources drift, and the frozen instrument includes exact message,
      # evidence and basis text, not only rule behaviour.
      - name: Check out the frozen instrument
        uses: actions/checkout@v4
        with:
          ref: evaluation-v1.0.0
          path: .instrument

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the frozen instrument
        working-directory: .instrument
        run: |
          npm ci
          npm run build

      - name: Assert the instrument's identity
        run: |
          expected=9f43862d033e1b45890f977cffb89ca4a9504d40
          actual=$(git -C .instrument rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "instrument is at $actual, expected $expected (evaluation-v1.0.0)"; exit 1
          fi
          expected_lock=2a88d26ebeee56016b92f9a9a3f2584c99df6c77b3d01ccd753910412f626a1f
          actual_lock=$(shasum -a 256 .instrument/package-lock.json | cut -d' ' -f1)
          if [ "$actual_lock" != "$expected_lock" ]; then
            echo "instrument lockfile is $actual_lock, expected $expected_lock"; exit 1
          fi
          echo "instrument verified: $actual"

      - name: Evaluation harness tests
        working-directory: evaluation
        env:
          FORMFAIR_INSTRUMENT_DIR: ${{ github.workspace }}/.instrument
        run: npm test

  solo-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the working instrument and solo study
        uses: actions/checkout@v7
        with:
          # Tags decide whether the official study may run at all, so they must be present.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the working instrument
        run: npm run build

      - name: Solo study tests
        run: npm --prefix evaluation run test:solo

      # A synthetic development report. The real-form command has no equivalent bypass:
      # --development is refused unless the corpus itself is marked synthetic.
      - name: Exercise the technical-study CLI
        run: npm --prefix evaluation run solo:study -- --development --out "$RUNNER_TEMP/solo-study.json"

      - name: Assert the machine-readable study passed
        run: node -e "const r=require(process.argv[1]); if(!r.passed) process.exit(1)" "$RUNNER_TEMP/solo-study.json"

      # The path the final study actually uses, exercised on every push rather than only
      # when someone remembers to run it.
      #
      # It runs against a real checkout of the instrument tag rather than against HEAD,
      # because HEAD is normally a descendant of the tag and would refuse. Faking a tag at
      # HEAD would exercise the branch but not the discipline, so the tag is checked out
      # properly. Both outcomes are asserted: the tagged tree must PASS, and the current
      # tree must REFUSE and write nothing.
      - name: Official-mode study against the frozen instrument tag
        run: |
          set -euo pipefail
          TAG=evaluation-v1.1.0
          git worktree add --detach "$RUNNER_TEMP/frozen" "$TAG"
          ( cd "$RUNNER_TEMP/frozen" && npm ci --silent --no-audit --no-fund && npm run build --silent )
          ( cd "$RUNNER_TEMP/frozen" && npm --prefix evaluation run solo:study -- --out "$RUNNER_TEMP/official.json" )
          node -e "const r=require(process.argv[1]);
            if (!r.passed) { console.error('official study did not pass'); process.exit(1); }
            const i = r.instrument ?? {};
            if (i.tag !== 'evaluation-v1.1.0' || i.dirty !== false || i.officialReady !== true) {
              console.error('official study ran without a clean tagged instrument', i);
              process.exit(1);
            }
            console.log('official study passed against', i.tag, 'at', i.commit);
          " "$RUNNER_TEMP/official.json"

      - name: The working tree must not be able to produce an official study
        run: |
          set -euo pipefail
          if npm --prefix evaluation run solo:study -- --out "$RUNNER_TEMP/should-not-exist.json"; then
            echo "official study ran on an untagged or modified checkout" >&2
            exit 1
          fi
          test ! -f "$RUNNER_TEMP/should-not-exist.json"
          echo "refused, and wrote nothing."

  capture-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capture/package-lock.json

      - name: Install the capture harness
        working-directory: capture
        run: npm ci

      # The harness drives a real browser, so CI needs one. Chromium only: the descriptive
      # scan is defined against one engine and one viewport.
      - name: Install Chromium
        working-directory: capture
        run: npx playwright install --with-deps chromium

      # Thirteen tests, none of which reaches the network. The end-to-end one drives the
      # real CLI and hands its output to the FROZEN corpus seal, so the chain from capture
      # to ledger to draft to corpus is checked where it is actually used.
      - name: Capture harness tests
        working-directory: capture
        run: npm test

      # The harness must not be able to analyse anything. A page judged before the corpus
      # containing it is sealed would defeat the seal entirely. Checked by parsing imports
      # rather than grepping for a product name, which matches schema identifiers too.
      - name: The capture harness must not import the analyser
        working-directory: capture
        run: node check-no-analyser.mjs
