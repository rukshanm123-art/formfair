name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Delegated accessibility suite
        run: npm run test:delegated

      - name: Build
        run: npm run build

      - name: Verify catalogue snapshot integrity
        working-directory: docs/catalogue-snapshots
        run: shasum -a 256 -c SHA256SUMS
