<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Calibration page 4</title></head>
<body>
  <h1>Calibration page 4</h1>
  <p>Synthetic. Not a real form, and not from any agency.</p>
  <form action="#" method="post">
    <p><label for="c-B01">First name</label><input id="c-B01" name="firstName" autocomplete="given-name" type="text" pattern="[\p{L}\p{M}'’ \-]+"></p>
    <p><label for="pc">Postcode</label><input id="pc" name="postcode" pattern="[0-9]{4}"></p>
    <p><label for="c-B02">Last name</label><input id="c-B02" name="lastName" autocomplete="family-name" type="text" pattern="[\p{L}\p{M}'’ \-]{2,}"></p>
    <p><label for="cnt">Country</label><input id="cnt" name="country" autocomplete="country-name"></p>
    <p><label for="c-B03">Given name</label><input id="c-B03" name="givenName" autocomplete="given-name" type="text" pattern="[A-Za-zÀ-ÿ]+"></p>
    <p><label for="dept">Department</label><input id="dept" name="department"></p>
    <p><label for="c-B04">Family name</label><input id="c-B04" name="familyName" autocomplete="family-name" type="text" pattern="[A-Za-zÀ-ÿ'’ \-]+"></p>
    <p><label for="file">File name</label><input id="file" name="fileName"></p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
