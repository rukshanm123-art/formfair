<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Calibration page 2</title></head>
<body>
  <h1>Calibration page 2</h1>
  <p>Synthetic. Not a real form, and not from any agency.</p>
  <form action="#" method="post">
    <p><label for="c-A05">Preferred name</label><input id="c-A05" name="preferredName" autocomplete="nickname" type="text" pattern="[A-Za-z'’ \-]{2,50}"></p>
    <p><label for="pet">Pet name</label><input id="pet" name="petName"></p>
    <p><label for="c-A06">Full name</label><input id="c-A06" name="fullName" autocomplete="name" type="text" pattern="[A-Za-z]{3,20}"></p>
    <p><label for="prod">Product name</label><input id="prod" name="productName"></p>
    <p><label for="c-A07">First name</label><input id="c-A07" name="firstName" autocomplete="given-name" type="text" pattern="[A-Za-z ]+"></p>
    <p><label for="city">Town or city</label><input id="city" name="city" autocomplete="address-level2"></p>
    <p><label for="c-A08">Last name</label><input id="c-A08" name="lastName" autocomplete="family-name" type="text" pattern="[A-Za-z\-]+" minlength="2"></p>
    <p><label for="dn">Display name shown to other users</label><input id="dn" name="displayName"></p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
