<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Calibration page 3</title></head>
<body>
  <h1>Calibration page 3</h1>
  <p>Synthetic. Not a real form, and not from any agency.</p>
  <form action="#" method="post">
    <p><label for="c-A09">Given name</label><input id="c-A09" name="givenName" autocomplete="given-name" type="text" pattern="[A-Za-z]+" maxlength="5"></p>
    <p><label for="ref">Reference number</label><input id="ref" name="reference" pattern="[A-Z0-9\-]+"></p>
    <p><label for="c-A10">Family name</label><input id="c-A10" name="familyName" autocomplete="family-name" type="text" pattern="[A-Za-z'’ \-]+" minlength="4"></p>
    <p><label for="sub">Subject</label><input id="sub" name="subject"></p>
    <p><label for="c-A11">Preferred name</label><input id="c-A11" name="preferredName" autocomplete="nickname" type="text" pattern="[A-Za-z]{1,30}"></p>
    <p><label for="bus">Trading name of your business</label><input id="bus" name="tradingName"></p>
    <p><label for="c-A12">Full name</label><input id="c-A12" name="fullName" autocomplete="name" type="text" pattern="[A-Za-z'’ \-]{2,}"></p>
    <p><label for="occ">Occupation</label><input id="occ" name="occupation"></p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
